server {
    listen 127.0.0.1:15681;
    server_name localhost;
    access_log off;
    error_log /var/log/nginx/error.log warn;
    client_max_body_size 256k;
    client_body_timeout 10s;

    location = /webhook/support-to-sale-ai-chat-v1 {
        limit_except POST { deny all; }
        auth_basic "Support-to-Sale n8n";
        auth_basic_user_file /etc/nginx/iikuznitsa-n8n.htpasswd;

        proxy_pass http://127.0.0.1:5678;
        proxy_pass_request_headers off;
        proxy_set_header Host 127.0.0.1:5678;
        proxy_set_header Content-Type application/json;
        proxy_set_header Content-Length $content_length;
        proxy_connect_timeout 2s;
        proxy_read_timeout 26s;
        proxy_send_timeout 4s;
    }
    location / { return 404; }
}
