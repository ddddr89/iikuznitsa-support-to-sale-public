server {
    listen 80;
    server_name iikuznitsa.ydna.tech;
    access_log off;

    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/iikuznitsa-acme;
        try_files $uri =404;
    }

    location / { return 301 https://iikuznitsa.ydna.tech$request_uri; }
}

server {
    listen 443 ssl;
    server_name iikuznitsa.ydna.tech;

    ssl_certificate /etc/letsencrypt/live/iikuznitsa.ydna.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/iikuznitsa.ydna.tech/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    access_log off;
    client_max_body_size 256k;
    client_body_timeout 10s;

    location / {
        proxy_pass https://127.0.0.1:18443;
        proxy_ssl_verify on;
        proxy_ssl_trusted_certificate /etc/nginx/iikuznitsa-origin.pem;
        proxy_ssl_name localhost;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 3s;
        proxy_read_timeout 55s;
        proxy_send_timeout 10s;
    }
}
